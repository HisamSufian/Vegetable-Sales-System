{% for r in rows %}
<a class="row" href="/profiles/{{ kind }}/{{ r.id }}">
  <span class="row-main"><strong>{{ r.label }}</strong>{% if r.sub %}<small>{{ r.sub }}</small>{% endif %}</span>
  {% if r.is_deleted %}<span class="badge">Hidden</span>{% endif %}
</a>
{% else %}
<p class="muted">Nothing here yet.</p>
{% endfor %}
